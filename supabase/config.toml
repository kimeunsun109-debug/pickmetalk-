# Auth redirect URLs for email confirmation and password reset.
# Push with: npx supabase config push --yes

[auth]
site_url = "https://pickmetalk.com"
# Include app OAuth/email callback (/api/auth/callback). Provider consoles use
# https://<project-ref>.supabase.co/auth/v1/callback — see docs/AUTH_OAUTH.md.
additional_redirect_urls = [
  "http://localhost:3000/**",
  "http://localhost:3000/api/auth/callback",
  "https://pickmetalk.com/**",
  "https://pickmetalk.com/api/auth/callback",
  "https://www.pickmetalk.com/**",
  "https://www.pickmetalk.com/api/auth/callback",
  "https://*.vercel.app/**",
]

[auth.email.template.recovery]
subject = "픽미톡 비밀번호 재설정"
content_path = "supabase/templates/recovery.html"
