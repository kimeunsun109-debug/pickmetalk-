<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <!-- 배경 -->
  <rect width="400" height="400" rx="200" fill="#F0FFF8"/>
  <!-- 원형 테두리 -->
  <circle cx="200" cy="200" r="196" fill="none" stroke="#34D399" stroke-width="8" opacity="0.4"/>
  <!-- 이니셜 배경 원 -->
  <circle cx="200" cy="175" r="90" fill="#34D399" opacity="0.15"/>
  <!-- 이모지 (폴백 텍스트) -->
  <text x="200" y="195" font-size="90" text-anchor="middle" dominant-baseline="middle"
        font-family="Apple Color Emoji, Segoe UI Emoji, Noto Color Emoji, sans-serif">⚡</text>
  <!-- 이름 -->
  <text x="200" y="310" font-size="36" font-weight="700" text-anchor="middle"
        font-family="Noto Sans KR, Malgun Gothic, sans-serif" fill="#34D399">지유</text>
  <!-- 설명 -->
  <text x="200" y="348" font-size="16" text-anchor="middle"
        font-family="Noto Sans KR, Malgun Gothic, sans-serif" fill="#34D399" opacity="0.6">활기찬 지유</text>
</svg>